name: onevoice

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      ONEVOICE_MEDIA_ROOT: /app/renders
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      ONEVOICE_FONT_PATH: /usr/share/fonts/dejavu/DejaVuSans.ttf
      ONEVOICE_TTS_ENDPOINT: http://tts:8123
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - onevoice-renders:/app/renders
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Render worker riêng: poll -> claim -> render -> release, một job tại một
  # thời điểm. Chạy cùng image với app (dist/worker.js được build trong
  # Dockerfile). Không bind port, không healthcheck HTTP — tiến trình loop
  # không bao giờ crash, job dở được recoverStale nhặt lại sau restart.
  # Lưu ý: không depends_on tts vì tts nằm sau profile; khi profile tts chưa
  # bật, các job template-renderer cần TTS sẽ fail rõ ràng thay vì treo.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    command:
      - node
      - dist/worker.js
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      ONEVOICE_MEDIA_ROOT: /app/renders
      ONEVOICE_QUEUE_ROOT: /app/renders/queue
      ONEVOICE_TEMPLATES_ROOT: /app/templates
      ONEVOICE_AUDIO_ROOT: /app/assets/audio
      ONEVOICE_TTS_ENDPOINT: http://tts:8123
      ONEVOICE_HYPERFRAMES_PATH: hyperframes
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      ONEVOICE_FONT_PATH: /usr/share/fonts/dejavu/DejaVuSans.ttf
    volumes:
      - onevoice-renders:/app/renders
    shm_size: 1gb
    stop_grace_period: 300s
    restart: unless-stopped
  # VieNeu-TTS sidecar. Nặng (model weights trong HF_HOME) nên nằm sau
  # profile `tts`: `docker compose --profile tts up -d`. Healthcheck trỏ
  # GET /health, trả 503 cho tới khi model load xong (MODEL_NOT_READY) nên
  # start_period để rộng.
  tts:
    build:
      context: ./services/tts
      dockerfile: Dockerfile
    profiles:
      - tts
    environment:
      VIENEU_MODE: v3turbo
      VIENEU_VOICE: "female-north-1"
      HF_HOME: /models
      HF_HUB_OFFLINE: "1"
      TTS_MAX_CHARS: "400"
      TTS_PORT: "8123"
    volumes:
      - onevoice-tts-models:/models
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/health')"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  onevoice-renders:
  onevoice-tts-models:
