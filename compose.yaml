name: onevoice

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      ONEVOICE_MEDIA_ROOT: /app/renders
    ports:
      - "3000:3000"
    volumes:
      - onevoice-renders:/app/renders
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  onevoice-renders:
