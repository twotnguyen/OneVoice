name: opencorp

# Lõi hạ tầng OpenCorp — chạy: docker compose up -d
# Kèm Chatwoot (trục CSKH):    docker compose --profile cskh up -d
# Xem README.md để biết bước khởi tạo lần đầu.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opencorp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opencorp_dev}
      POSTGRES_DB: opencorp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencorp"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "6333:6333"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: opencorp
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-opencorp_dev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator:
    build: ./services/orchestrator
    environment:
      DATABASE_URL: postgresql://opencorp:${POSTGRES_PASSWORD:-opencorp_dev}@postgres:5432/opencorp
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # ---- Trục CSKH (Chatwoot) — bật bằng: --profile cskh ----
  redis:
    image: redis:7-alpine
    profiles: [cskh]
    volumes:
      - redisdata:/data

  chatwoot:
    image: chatwoot/chatwoot:latest
    profiles: [cskh]
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    environment: &chatwoot_env
      SECRET_KEY_BASE: ${CHATWOOT_SECRET:-thay_bang_chuoi_ngau_nhien_dai}
      FRONTEND_URL: http://localhost:3000
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: opencorp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opencorp_dev}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://redis:6379
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      ENABLE_ACCOUNT_SIGNUP: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  chatwoot-worker:
    image: chatwoot/chatwoot:latest
    profiles: [cskh]
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment: *chatwoot_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  qdrantdata:
  redisdata:
